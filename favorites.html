<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natura — Favorites</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Nunito Sans', sans-serif; }
  .title-font { font-family: 'Fraunces', serif; }
  .soft-shadow { box-shadow: 0 12px 35px rgba(39,70,44,.08); }
  .product-card { transition: transform .35s ease, box-shadow .35s ease; }
  .product-card:hover { transform: translateY(-7px); box-shadow: 0 22px 45px rgba(39,70,44,.14); }
  .product-image { transition: transform .5s cubic-bezier(.2,.7,.2,1); }
  .product-card:hover .product-image { transform: scale(1.07); }
  .image-wrap { overflow: hidden; }
</style>
</head>
<body class="bg-[#f7f7ec] text-[#27462c] min-h-screen"><header class="fixed top-0 left-0 right-0 z-50 bg-[#f7f7ec]/95 backdrop-blur-md border-b border-[#e8ebdf] shadow-sm">
  <div class="max-w-7xl mx-auto px-6 lg:px-8 py-4 flex items-center justify-between">
    <a href="index.html" class="leading-none">
      <p class="title-font text-3xl font-bold text-[#27462c]">Natura <i class="fa-solid fa-leaf text-[#4d7a35] text-lg align-top"></i></p>
      <p class="text-[10px] tracking-[0.2em] text-[#7c8a75] font-semibold mt-1">EAT WELL, LIVE WELL</p>
    </a>
    <div class="flex items-center gap-4">
      <a href="favorites.html" class="relative text-[#3b4a3a] hover:text-[#e0554f] transition text-lg" aria-label="Favorites">
        <i class="fa-regular fa-heart"></i><span id="headerFavCount" class="absolute -top-2 -right-2 bg-[#e0554f] text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
      </a>
      <a href="cart.html" class="relative text-[#3b4a3a] hover:text-[#3e7a35] transition text-lg" aria-label="Cart">
        <i class="fa-solid fa-bag-shopping"></i><span id="headerCartCount" class="absolute -top-2 -right-2 bg-[#3e7a35] text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
      </a>
      <div id="authArea" class="flex items-center gap-3"></div>
    </div>
  </div>
</header>
<main class="max-w-6xl mx-auto px-6 pt-32 pb-12"><h1 class="title-font text-4xl font-bold mb-2">My Favorites</h1><p class="text-[#7c8a75] mb-8">Your saved healthy favorites.</p><div id="fav"></div></main>
<script>
const products=[{id:1,name:"Tropical Fruit Bowl",price:5.99,image:"images/1 (1).png"},{id:2,name:"Berry Banana Blend",price:4.49,image:"images/1 (2).png"},{id:3,name:"Citrus Mango Mix",price:4.99,image:"images/1 (3).png"},{id:4,name:"Berry Kiwi Delight",price:5.49,image:"images/1 (4).png"},{id:5,name:"Premium Mixed Nuts",price:7.49,image:"images/1 (5).png"},{id:6,name:"Roasted Almonds",price:6.29,image:"images/1 (6).png"},{id:7,name:"Cashew & Walnut Mix",price:8.19,image:"images/1 (7).png"},{id:8,name:"Trail Mix Deluxe",price:6.99,image:"images/1 (8).png"},{id:9,name:"Healthy Mushroom Burger",price:6.99,image:"images/1 (14).png"},{id:10,name:"Creamy Mushroom Delight",price:7.29,image:"images/1 (12).png"},{id:11,name:"Quinoa Power Bowl",price:6.49,image:"images/1 (11).png"},{id:12,name:"Mediterranean Bowl",price:7.49,image:"images/1 (10).png"}];
function render(){let fav=JSON.parse(localStorage.getItem('naturaFavorites')||'[]').map(Number),items=products.filter(p=>fav.includes(p.id)),el=document.getElementById('fav');if(!items.length){el.innerHTML='<div class="bg-white rounded-3xl p-14 text-center soft-shadow"><i class="fa-regular fa-heart text-5xl text-[#c3cdb5]"></i><h2 class="title-font text-2xl font-bold mt-5">No favorites yet</h2><p class="text-[#7c8a75] mt-2">Save the products you love and find them here.</p><a href="index.html" class="inline-block mt-6 bg-[#3e7a35] text-white font-bold px-6 py-3 rounded-xl">Explore Products</a></div>';return}el.innerHTML='<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-7">'+items.map(p=>`<article class="product-card bg-white rounded-2xl overflow-hidden soft-shadow border border-[#eef0e6]"><div class="relative image-wrap"><img src="${p.image}" class="product-image w-full h-60 object-cover"><button onclick="removeFav(${p.id})" class="absolute top-4 right-4 w-10 h-10 bg-white/95 rounded-full text-[#e0554f]"><i class="fa-solid fa-heart"></i></button></div><div class="p-5"><h3 class="title-font text-xl font-bold">${p.name}</h3><div class="flex items-center justify-between mt-4"><span class="font-bold text-[#4d7a35]">$${p.price.toFixed(2)}</span><button onclick="add(${p.id})" class="bg-[#3e7a35] text-white font-bold px-4 py-2.5 rounded-lg">Add to Cart</button></div></div></article>`).join('')+'</div>'}
function removeFav(id){let f=JSON.parse(localStorage.getItem('naturaFavorites')||'[]').filter(x=>Number(x)!==id);localStorage.setItem('naturaFavorites',JSON.stringify(f));render()}
function add(id){let c=JSON.parse(localStorage.getItem('naturaCart')||'{}');c[id]=(c[id]||0)+1;localStorage.setItem('naturaCart',JSON.stringify(c))}
render();
</script><script>
function updateHeader(){
  const user=JSON.parse(localStorage.getItem('naturaUser')||'null');
  const loggedIn=localStorage.getItem('naturaLoggedIn')==='true';
  const area=document.getElementById('authArea');
  const fav=JSON.parse(localStorage.getItem('naturaFavorites')||'[]');
  const cart=JSON.parse(localStorage.getItem('naturaCart')||'{}');
  const favCount=document.getElementById('headerFavCount');
  const cartCount=document.getElementById('headerCartCount');
  if(favCount) favCount.textContent=fav.length;
  if(cartCount) cartCount.textContent=Object.values(cart).reduce((a,b)=>a+Number(b),0);
  if(loggedIn && user){
    area.innerHTML=`<span class="hidden sm:inline text-sm font-bold text-[#27462c]">Hi, ${user.name}</span><button onclick="logout()" class="bg-[#27462c] hover:bg-[#1f3b23] text-white font-semibold text-sm px-4 py-2.5 rounded-full transition"><i class="fa-solid fa-right-from-bracket mr-1"></i> Logout</button>`;
  }else{
    area.innerHTML=`<a href="login.html" class="border border-[#d8ddcb] text-[#2f4d28] font-semibold text-sm px-5 py-2.5 rounded-full hover:bg-white transition">Login</a><a href="register.html" class="bg-[#3e7a35] hover:bg-[#32652b] text-white font-semibold text-sm px-5 py-2.5 rounded-full transition">Register</a>`;
  }
}
function logout(){localStorage.removeItem('naturaLoggedIn');location.href='index.html';}
updateHeader();
</script>
<footer class="mt-16 bg-[#27462c] text-white">
  <div class="max-w-6xl mx-auto px-6 py-12">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
      <div>
        <a href="index.html" class="title-font text-3xl font-bold inline-block">Natura <i class="fa-solid fa-leaf text-[#9abf73] text-lg"></i></a>
        <p class="text-[#d9e1d3] mt-3 leading-7 max-w-sm">Fresh, wholesome choices made to help you eat well and live well.</p>
      </div>

      <div>
        <h3 class="font-bold text-lg mb-4">Quick Links</h3>
        <div class="flex flex-col gap-3 text-[#d9e1d3]">
          <a href="index.html" class="hover:text-white transition">Home</a>
          <a href="favorites.html" class="hover:text-white transition">Favorites</a>
          <a href="cart.html" class="hover:text-white transition">Cart</a>
          <a href="login.html" class="hover:text-white transition">Login</a>
        </div>
      </div>

      <div>
        <h3 class="font-bold text-lg mb-4">Follow Us</h3>
        <div class="flex gap-3">
          <a href="#" aria-label="Instagram" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition"><i class="fa-brands fa-instagram"></i></a>
          <a href="#" aria-label="Facebook" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#" aria-label="Twitter" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition"><i class="fa-brands fa-x-twitter"></i></a>
        </div>
        <p class="text-[#d9e1d3] mt-4 text-sm">Healthy choices. Simple living.</p>
      </div>
    </div>

    <div class="border-t border-white/10 mt-10 pt-6 flex flex-col sm:flex-row justify-between gap-3 text-sm text-[#bfcbbb]">
      <span>© 2026 Natura. All rights reserved.</span>
      <span>Eat Well, Live Well.</span>
    </div>
  </div>
</footer>

</body></html>
